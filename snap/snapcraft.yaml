name: torreader
version: '2.4.0'
base: core22
grade: stable
confinement: strict

summary: Fast offline PDF reader, editor and merger
description: |
  TorReader PDF is a fast, offline, portable PDF reader and editor for large documents.
  Open 900 MB files in 1–2 seconds, scroll continuously, and view crisp text at any zoom level.

  Features:
  • Merge PDFs with bookmark remapping — preserves bookmark page numbers
  • Split by page count or file size, extract or insert pages from other files
  • Free in-app text translation
  • Annotations: freehand, highlight, line/arrow, text, note, rectangle
  • OCR for scanned documents — 10 languages, bundled and fully offline
  • Select, find and copy text — in PDFs and in scans (search ignores diacritics)
  • Full-text search (Ctrl+F, result count, sidebar Search tab)
  • Reorder / delete pages, dark mode
  • 100% offline, local — no account, no ads, no watermark

license: MIT
website: https://torreader.cloud
source-code: https://github.com/FelixNgH/TorreaderPDF
issues: https://github.com/FelixNgH/TorreaderPDF/issues

apps:
  torreader:
    extensions: [kde-neon-6]
    command: usr/bin/TorReader
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
    common-id: cloud.torreader.TorReader
    desktop: usr/share/applications/cloud.torreader.TorReader.desktop
    plugs:
      - home
      - removable-media
      - network
      - opengl
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - cups
      - unity7

parts:
  torreader:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    build-packages:
      - build-essential
      - qt6-base-dev
      - libqt6svg6-dev
      - libgl1-mesa-dev
      - liblcms2-dev
      - zlib1g-dev
      - libqpdf-dev
      - libjpeg-dev
      - libssl-dev
      - libtesseract-dev
      - libleptonica-dev
      - python3-pip
      - patchelf
    stage-packages:
      - libqpdf28
      - liblcms2-2
      - libtesseract4
      - liblept5
    override-build: |
      set -eux

      # CMake 3.30 (apt 3.22 too old; pin 3.30.x)
      pip install --target="${CRAFT_PART_BUILD}/cmake-tool" "cmake==3.30.*"
      export PATH="${CRAFT_PART_BUILD}/cmake-tool/bin:${PATH}"
      export PYTHONPATH="${CRAFT_PART_BUILD}/cmake-tool:${PYTHONPATH:-}"
      cmake --version   # in ra để chắc chắn là 3.30.x, không phải 3.22

      # pdfium on library path for linker
      export LD_LIBRARY_PATH="${CRAFT_PART_SRC}/third_party/pdfium/lib:${LD_LIBRARY_PATH}"

      # QPDF: dpkg-query đường dẫn thật, không hard-code kiến trúc
      QPDF_SO="$(dpkg -L libqpdf-dev | grep -E '/libqpdf\.so$' | head -1)"
      QPDF_INC="$(dpkg -L libqpdf-dev | grep -E '/qpdf/QPDF\.hh$' | head -1)"
      QPDF_INC="$(dirname "$(dirname "$QPDF_INC")")"
      test -n "$QPDF_SO" && test -f "$QPDF_SO" || { echo "libqpdf.so not found"; exit 1; }
      echo "QPDF: $QPDF_SO / $QPDF_INC"

      cmake \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DQPDF_LIB="$QPDF_SO" \
        -DQPDF_INCLUDE="$QPDF_INC" \
        "${CRAFT_PART_SRC}"
      make -j"$(nproc)"

      # ── Stage files ──────────────────────────────────────────────────────

      # Binary
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin"
      cp "${CRAFT_PART_BUILD}/bin/TorReader" "${CRAFT_PART_INSTALL}/usr/bin/"

      # Set rpath so libpdfium.so, Qt libs, and stage-packages are found
      TRIPLET="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
      patchelf --set-rpath "\$ORIGIN/../lib:\$ORIGIN/../lib/${TRIPLET}" \
        "${CRAFT_PART_INSTALL}/usr/bin/TorReader"
      patchelf --print-rpath "${CRAFT_PART_INSTALL}/usr/bin/TorReader"

      # Set rpath $ORIGIN for staged libtesseract and liblept so transitive deps are found
      for lib in "${CRAFT_PART_INSTALL}/usr/lib/${TRIPLET}"/libtesseract.so.* \
                 "${CRAFT_PART_INSTALL}/usr/lib/${TRIPLET}"/liblept.so.*; do
        if [ -f "$lib" ] && [ ! -L "$lib" ]; then
          patchelf --set-rpath "\$ORIGIN" "$lib" || true
        fi
      done

      # Du lieu OCR: 10 ngon ngu, dat canh binary vi OcrEngine::tessdataDir()
      # tim <thu muc exe>/tessdata truoc khi thu cac duong khac.
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin/tessdata"
      cp "${CRAFT_PART_SRC}"/resources/tessdata/*.traineddata \
        "${CRAFT_PART_INSTALL}/usr/bin/tessdata/"
      ls -1 "${CRAFT_PART_INSTALL}/usr/bin/tessdata/" | wc -l   # phai la 10

      # libpdfium.so (bundled pre-built binary)
      mkdir -p "${CRAFT_PART_INSTALL}/usr/lib"
      cp "${CRAFT_PART_SRC}/third_party/pdfium/lib/libpdfium.so" \
        "${CRAFT_PART_INSTALL}/usr/lib/"

      # Desktop file
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/applications"
      cp "${CRAFT_PART_SRC}/packaging/linux/cloud.torreader.TorReader.desktop" \
        "${CRAFT_PART_INSTALL}/usr/share/applications/"

      # Fix Exec= and Icon= for snap layout
      sed -i 's|^Exec=TorReader %f|Exec=torreader %f|' \
        "${CRAFT_PART_INSTALL}/usr/share/applications/cloud.torreader.TorReader.desktop"
      sed -i 's|^Icon=cloud.torreader.TorReader|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/cloud.torreader.TorReader.png|' \
        "${CRAFT_PART_INSTALL}/usr/share/applications/cloud.torreader.TorReader.desktop"

      # Metainfo
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/metainfo"
      cp "${CRAFT_PART_SRC}/packaging/linux/cloud.torreader.TorReader.metainfo.xml" \
        "${CRAFT_PART_INSTALL}/usr/share/metainfo/"

      # Icon
      mkdir -p "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps"
      cp "${CRAFT_PART_SRC}/resources/Logo_rectangle.png" \
        "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/256x256/apps/cloud.torreader.TorReader.png"


